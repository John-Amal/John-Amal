<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="55%" stop-color="#0b1a2b"/>
      <stop offset="100%" stop-color="#0f2b3d"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#0c2f3a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#e0f2fe">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="70" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="35" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="90" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="25" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="20" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="1080" cy="55" r="90" fill="url(#moonGlow)"/>
  <circle cx="1080" cy="55" r="18" fill="#f8fafc" opacity="0.9"/>

  <!-- distant alps -->
  <polygon points="640,300 700,170 745,225 800,130 855,215 905,150 960,230 1015,165 1075,240 1200,300" fill="#122a3d" opacity="0.55"/>

  <!-- orbiting satellite around wireframe globe -->
  <g transform="translate(950,150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="80s" repeatCount="indefinite"/>
      <circle r="55" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <ellipse rx="55" ry="18" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1"/>
      <ellipse rx="55" ry="18" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1" transform="rotate(60)"/>
      <ellipse rx="55" ry="18" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1" transform="rotate(120)"/>
    </g>
    <g>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M 0,-75 A 75,30 0 1,1 -0.1,-75 Z"/>
      <rect x="-6" y="-3" width="12" height="6" rx="1.5" fill="#e2e8f0"/>
      <rect x="-16" y="-1.5" width="8" height="3" fill="#38bdf8"/>
      <rect x="8" y="-1.5" width="8" height="3" fill="#38bdf8"/>
    </g>
  </g>

  <!-- HPC data network, pulsing nodes -->
  <g stroke="#7dd3fc" stroke-opacity="0.3" stroke-width="1">
    <line x1="480" y1="90" x2="560" y2="60"/>
    <line x1="560" y1="60" x2="640" y2="100"/>
    <line x1="480" y1="90" x2="540" y2="140"/>
    <line x1="540" y1="140" x2="640" y2="100"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="480" cy="90" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="60" r="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="100" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="140" r="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- robot character with laptop -->
  <g transform="translate(150,150)">
    <rect x="-55" y="70" width="150" height="6" rx="2" fill="#1b3346"/>
    <rect x="-30" y="55" width="90" height="16" rx="3" fill="#1e293b"/>
    <rect x="-25" y="0" width="80" height="55" rx="4" fill="url(#screenGrad)" stroke="#38bdf8" stroke-opacity="0.4"/>
    <g fill="#38bdf8">
      <rect x="-15" y="35" width="8" height="12">
        <animate attributeName="height" values="12;28;12" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="35;19;35" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="-2" y="25" width="8" height="22">
        <animate attributeName="height" values="22;10;22" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="25;37;25" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="11" y="30" width="8" height="17">
        <animate attributeName="height" values="17;30;17" dur="3s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;17;30" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="-20" y="-55" width="40" height="35" rx="10" fill="#334155"/>
    <rect x="-16" y="-90" width="32" height="28" rx="8" fill="#475569"/>
    <line x1="0" y1="-90" x2="0" y2="-100" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="-102" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <g fill="#e0f2fe">
      <circle cx="-6" cy="-77" r="3">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="6" cy="-77" r="3">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <line x1="-18" y1="-30" x2="-25" y2="60" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <line x1="18" y1="-30" x2="25" y2="60" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- coffee mug with steam -->
  <g transform="translate(260,205)">
    <rect x="0" y="0" width="18" height="14" rx="2" fill="#334155"/>
    <path d="M18,3 q6,0 6,5 q0,5 -6,5" fill="none" stroke="#334155" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.5" fill="none">
      <path d="M4,-2 q3,-6 0,-10 q-3,-4 0,-10">
        <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M12,-2 q3,-6 0,-10 q-3,-4 0,-10">
        <animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- animated ocean waves, layered parallax -->
  <g transform="translate(0,205)" opacity="0.28">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-1200,0" dur="16s" repeatCount="indefinite"/>
      <path d="M0,20 C100,0 200,40 300,20 C400,0 500,40 600,20 C700,0 800,40 900,20 C1000,0 1100,40 1200,20 L1200,95 L0,95 Z" fill="#0e7490"/>
      <path d="M1200,20 C1300,0 1400,40 1500,20 C1600,0 1700,40 1800,20 C1900,0 2000,40 2100,20 C2200,0 2300,40 2400,20 L2400,95 L1200,95 Z" fill="#0e7490"/>
    </g>
  </g>
  <g transform="translate(0,225)" opacity="0.4">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-1200,0" dur="11s" repeatCount="indefinite"/>
      <path d="M0,15 C100,-5 200,35 300,15 C400,-5 500,35 600,15 C700,-5 800,35 900,15 C1000,-5 1100,35 1200,15 L1200,75 L0,75 Z" fill="#0891b2"/>
      <path d="M1200,15 C1300,-5 1400,35 1500,15 C1600,-5 1700,35 1800,15 C1900,-5 2000,35 2100,15 C2200,-5 2300,35 2400,15 L2400,75 L1200,75 Z" fill="#0891b2"/>
    </g>
  </g>
  <g transform="translate(0,245)" opacity="0.55">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-1200,0" dur="8s" repeatCount="indefinite"/>
      <path d="M0,12 C100,-8 200,32 300,12 C400,-8 500,32 600,12 C700,-8 800,32 900,12 C1000,-8 1100,32 1200,12 L1200,55 L0,55 Z" fill="#06b6d4"/>
      <path d="M1200,12 C1300,-8 1400,32 1500,12 C1600,-8 1700,32 1800,12 C1900,-8 2000,32 2100,12 C2200,-8 2300,32 2400,12 L2400,55 L1200,55 Z" fill="#06b6d4"/>
    </g>
  </g>
</svg>
